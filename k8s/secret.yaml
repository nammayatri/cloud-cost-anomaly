# Template. Apply real values from prod/ (gitignored), never this file.
#
# The Xyne JWT is long-lived and carries no expiry claim, so treat it exactly as
# you would the Slack bot token: secret-only, rotated on a schedule, never in an
# image or a manifest under version control.
apiVersion: v1
kind: Secret
metadata:
  name: cost-report-secret
  namespace: <NAMESPACE>
type: Opaque
stringData:
  SLACK_BOT_TOKEN: "xoxb-REPLACE-ME"
  SLACK_CHANNEL_ID: "<CHANNEL_ID_OR_NAME>"
  # Omit if not posting to a second destination.
  XYNE_JWT: "<APP_JWT>"

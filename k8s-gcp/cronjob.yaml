---
# Workload Identity: binds this KSA to a GCP service account that can read the
# billing export. Create the GSA + binding first (see k8s-gcp/README-deploy.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-anomaly-cron
  namespace: <NAMESPACE>
  annotations:
    iam.gke.io/gcp-service-account: <GSA_NAME>@<GCP_PROJECT>.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcp-cost-anomaly-cron
  namespace: <NAMESPACE>
spec:
  # 14:00 UTC = 19:30 IST.
  # Deliberately LATER than the AWS cron's 12:00 UTC: GCP restates billing rows
  # for ~24-48h after the usage day, so an early run reports partial numbers and
  # fires false anomalies. Moving it later protects the zero-noise contract.
  schedule: "0 14 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cost-anomaly-cron
          containers:
            - name: gcp-cost-anomaly-cron
              image: <REGION>-docker.pkg.dev/<GCP_PROJECT>/<REPO>/cost-anomaly-cron:<TAG>
              imagePullPolicy: IfNotPresent
              command: ["python", "main.py"]
              args: ["--provider", "gcp"]
              env:
                - name: PROVIDER
                  value: "gcp"
                - name: GCP_BILLING_TABLE
                  value: "<PROJECT>.<DATASET>.<BILLING_EXPORT_TABLE>"
                - name: GCP_PROJECT
                  value: "<GCP_PROJECT>"
                # The export is billing-account-wide. This list is what scopes the
                # report — order is preserved, so the first entry leads the post.
                - name: GCP_PROJECTS
                  value: "project-a,project-b"
                - name: CURRENCY
                  value: "INR"
                - name: INCREASE_PCT_THRESHOLD
                  value: "5"
                - name: DECREASE_PCT_THRESHOLD
                  value: "5"
                # In rupees, not dollars — ₹1 would fire on nearly every SKU.
                - name: ABS_THRESHOLD
                  value: "500"
                - name: NOISE_FLOOR
                  value: "500"
                - name: LOOKBACK_DAYS
                  value: "21"
                - name: TOP_USAGE_TYPES
                  value: "3"
                - name: MENTION
                  value: ""
              envFrom:
                - secretRef:
                    name: gcp-cost-anomaly-cron-secret
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
